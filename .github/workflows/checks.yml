name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:server
      - name: Build the integrated frontend when present
        if: ${{ hashFiles('index.html') != '' }}
        run: npm run build
      - name: Verify Windows native host and scoped lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          ./windows/Test-Windows.ps1 -NodeExe $node
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./windows/Test-Windows.ps1 -NodeExe $node
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 checks failed.' }
