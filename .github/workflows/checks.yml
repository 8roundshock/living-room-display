name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # #710: the dependencies the installed app ships must have no high or critical advisory. The installer and the
      # updater install exactly these (`npm ci --omit=dev` on this package-lock.json). Build-only advisories are
      # recorded with their recheck trigger in docs/development.md (Dependency advisories).
      - name: Audit the shipped runtime dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:server
      - name: Build the integrated frontend when present
        if: ${{ hashFiles('index.html') != '' }}
        run: npm run build
