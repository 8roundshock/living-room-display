name: Windows installer
# Builds LivingRoomDisplaySetup-<version>.exe and smoke-tests install, repair
# and uninstall on clean runners. Only installer-related paths trigger it on
# pull requests (checks.yml already builds and tests the app) to keep the
# private repository's Actions minutes low.
on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/installer.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Windows checks (Windows PowerShell 5.1)
        shell: powershell
        run: .\windows\Test-Windows.ps1 -NodeExe (Get-Command node).Source
      - name: Windows checks (PowerShell 7)
        shell: pwsh
        run: ./windows/Test-Windows.ps1 -NodeExe (Get-Command node).Source
      - name: Ensure Inno Setup 6.7 or later
        shell: pwsh
        run: |
          $pin = Get-Content windows/installer/inno.json -Raw | ConvertFrom-Json
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $usable = $false
          if (Test-Path -LiteralPath $iscc) {
            $info = (Get-Item -LiteralPath $iscc).VersionInfo
            $version = [Version]::new($info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart)
            Write-Host "Preinstalled Inno Setup $version"
            $usable = $version.Major -eq 6 -and $version -ge [Version]$pin.minimumVersion
          }
          if (-not $usable) {
            Write-Host "Installing the pinned Inno Setup $($pin.testedVersion)"
            $download = Join-Path $env:RUNNER_TEMP 'innosetup-pinned.exe'
            Invoke-WebRequest -Uri $pin.url -OutFile $download -UseBasicParsing
            if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'The Inno Setup download does not match inno.json.' }
            $target = Join-Path $env:RUNNER_TEMP 'inno-setup'
            $launch = [Diagnostics.ProcessStartInfo]::new($download, "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER /DIR=`"$target`"")
            $launch.UseShellExecute = $false
            $process = [Diagnostics.Process]::Start($launch)
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed ($($process.ExitCode))." }
            $iscc = Join-Path $target 'ISCC.exe'
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the installer
        shell: pwsh
        run: ./windows/installer/Build-Installer.ps1 -OutputDirectory "$env:RUNNER_TEMP/installer" -IsccPath $env:ISCC_PATH
      - name: Payload checks
        shell: pwsh
        run: ./windows/installer/tests/Test-InstallerPayload.ps1 -ArchivePath "$env:RUNNER_TEMP/installer/payload.zip" -ReleaseJson "$env:RUNNER_TEMP/installer/release.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: living-room-display-setup
          path: |
            ${{ runner.temp }}/installer/LivingRoomDisplaySetup-*.exe
            ${{ runner.temp }}/installer/LivingRoomDisplaySetup-*.exe.sha256
            ${{ runner.temp }}/installer/release.json
          if-no-files-found: error
          retention-days: 14
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
        dir: [default, custom]
    runs-on: ${{ matrix.os }}
    # Windows on Arm (x64 emulation) is recorded under #122 but does not gate.
    continue-on-error: ${{ matrix.os == 'windows-11-arm' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: living-room-display-setup
          path: ${{ runner.temp }}/setup
      - name: Install, repair and uninstall smoke test
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/setup" -Filter 'LivingRoomDisplaySetup-*.exe' | Select-Object -First 1
          $expected = (Get-Content -LiteralPath "$($setup.FullName).sha256" -Raw).Split(' ')[0].Trim()
          if ((Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'The setup artifact does not match its .sha256 file.' }
          ./windows/installer/tests/Test-InstallerSmoke.ps1 -SetupPath $setup.FullName -ReleaseJson "$env:RUNNER_TEMP/setup/release.json" -DirectoryMode ${{ matrix.dir }}
